[pytest]
# Directorio donde buscar tests
testpaths = tests

# Patrón de archivos de test
python_files = test_*.py

# Patrón de clases de test
python_classes = Test*

# Patrón de funciones de test
python_functions = test_*

# Modo asyncio automático (para tests async)
asyncio_mode = auto

# Opciones de output
addopts = 
    -v
    --tb=short
    --strict-markers

# Marcadores personalizados
markers =
    asyncio: marca tests asíncronos
    integration: marca tests de integración
    unit: marca tests unitarios
