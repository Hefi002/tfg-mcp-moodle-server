[project]
name = "tfg-mcp-moodle-server"
version = "0.1.0"
description = "MCP Server for Moodle API integration"
requires-python = ">=3.10"
authors = [
    {name = "Tu Nombre", email = "tu@email.com"}
]
readme = "README.md"

dependencies = [
    # MCP Protocol
    "mcp[cli]>=1.0.0",
    # HTTP Clients
    "httpx>=0.27.0",
    "aiohttp>=3.8.5",
    # Utilities
    "python-dotenv>=1.0.0",
    "pydantic>=2.3.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.11.1",

    # Code Quality
    "black>=23.7.0",
    "pylint>=2.17.5",
    "flake8>=6.1.0",
    "mypy>=1.5.0",
    "isort>=5.12.0",

    # Development
    "ipython>=8.14.0",
    "pre-commit>=3.3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ← AÑADE ESTA SECCIÓN (lo que falta)
[tool.hatch.build.targets.wheel]
packages = ["src/mcp"]

# Configuración de herramientas
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.black]
line-length = 100

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
]
